      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained win-x64)
        run: dotnet publish StableVolume.csproj -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath StableVolume-portable-win-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          Get-ChildItem installer-out

      - uses: actions/upload-artifact@v4
        with:
          name: StableVolume-win-x64
          path: |
            installer-out/StableVolume-Setup.exe
            StableVolume-portable-win-x64.zip

      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest installer-out/StableVolume-Setup.exe StableVolume-portable-win-x64.zip --title "Stable Volume (latest build)" --notes "Installer and portable zip, built by GitHub Actions." --target ${{ github.sha }}
